version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused, plus the linters below.
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        # Small structs such as settings and model info are passed by value.
        - hugeParam
        - rangeValCopy
        # Bubble Tea models are pointers; returning one alongside a command
        # that mutates it is safe.
        - evalOrder
        # Tests pass the same scripted handler for consecutive model calls.
        - dupOption
        - unnamedResult
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
    staticcheck:
      checks:
        - all
        # Error strings may start with a proper noun such as "Anthropic".
        - -ST1005
        # Keep explicit embedded selectors next to overridden methods.
        - -QF1008
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/awersli99/unreal-tui
